<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão da oferta Platforms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e2841; --navy-2:#13375a; --navy-3:#1b4a77;
  --ink:#0e2841; --muted:#5b6b80; --line:#cdd7e4; --bg:#f3f6fa; --card:#ffffff;
  --accent:#e8ff00; --green:#1f9d6b; --amber:#c98a00; --red:#c23b4a; --violet:#7b5cff;
  --r:10px; --sh:0 1px 2px rgba(14,40,65,.07), 0 6px 18px rgba(14,40,65,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-3)}
.app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.side{width:252px;flex:0 0 252px;background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.side .grad{height:5px;background:linear-gradient(90deg,#2bff7a 0%,#7b5cff 48%,#e8ff00 100%)}
.brandbox{padding:24px 22px 18px}
.logo{display:block;width:172px;height:auto}
.brandsub{font-size:21px;font-weight:650;color:#fff;letter-spacing:-.01em;margin-top:15px;line-height:1.1}
.nav{padding:8px 12px;flex:1;overflow:auto}
.nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:#cfdbe7;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:#fff;color:var(--navy);font-weight:600}
.nav .n{font-size:11px;opacity:.65;width:16px;flex:0 0 16px}
.nav button.on .n{opacity:1;color:var(--navy-3)}
.sidefoot{padding:14px 20px 18px;font-size:11px;color:#8ea4ba;border-top:1px solid rgba(255,255,255,.1)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.top p{margin:3px 0 0;color:var(--muted);font-size:12.5px;max-width:720px}
.wrap{padding:22px 28px 60px}
.hidden{display:none!important}

/* ---------- controls ---------- */
.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--navy-2)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{background:#eef2f8}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.danger{background:#fff;color:var(--red);border-color:#f0ccd2}
.btn.danger:hover{background:#fdf2f4}
.btn.danger.armado{background:var(--red);color:#fff;border-color:var(--red)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar .sp{flex:1}
input[type=text],input[type=date],input[type=number],select,textarea{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd3ea;outline-offset:-1px}
textarea{resize:vertical;min-height:70px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.filter{width:auto;min-width:160px;flex:0 0 auto}
.search{width:300px;flex:0 0 300px;min-width:180px}

/* ---------- framework ---------- */
.fw{background:#fff;border:1px solid #b9c6d6;border-radius:12px;padding:16px 18px 14px;box-shadow:var(--sh)}
.layer{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#44556e;margin:9px 0 6px;display:flex;align-items:center;gap:10px}
.lay{position:relative;border:1px solid #a9bace;border-radius:10px;padding:14px 8px 8px;margin:20px 0 4px}
.fw>.lay:first-of-type{margin-top:8px}
.lay:last-of-type{margin-bottom:4px}
.lay.l1{background:#eaf0f7;padding:12px 8px 6px}
.lay.l1 .lrow{gap:5px}
.lay.l1 .nbox.band .hd{padding-top:3px;padding-bottom:3px;font-size:13px}
.lay.l1 .nbox.band .bd{padding-top:3px;padding-bottom:3px}
.lay.l2{background:#fff;border-color:#7f97b3;border-width:2px;padding:13px 7px 6px}
.lay.l3{background:#f3f5f8}
.layhd{position:absolute;top:-11px;left:14px;display:flex;align-items:center;gap:9px;margin:0}
.laytag{background:#fff;color:var(--navy);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 12px;border-radius:4px;white-space:nowrap}

.lay.l1 .nbox.band,.lay.l3 .nbox.band{border-color:#b9c6d6}
.laydesc{font-size:10.5px;color:#5b6b80;line-height:1.3}
.layer:first-child{margin-top:0}
.layer:before,.layer:after{content:"";height:1px;background:var(--line);flex:1}
.lrow{display:grid;gap:7px;align-items:stretch}
.nbox{display:flex;flex-direction:column;background:#fff;border:1px solid #b9c6d6;border-radius:11px;overflow:hidden;text-align:left;width:100%;padding:0;cursor:pointer;transition:box-shadow .12s, border-color .12s, transform .08s}
.nbox:hover{transform:translateY(-1px);border-color:#c3d4e6;box-shadow:0 10px 26px rgba(14,40,65,.12)}
.hd{background:#4e6b91;color:#fff;padding:5px 12px;font-size:13.5px;font-weight:650;letter-spacing:-.01em;line-height:1.25;position:relative;text-align:center}
.hd:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#2bff7a,#7b5cff,#e8ff00);opacity:0;transition:opacity .12s}
.nbox:hover .hd:after,.hdbtn:hover:after{opacity:1}
.hdbtn{display:block;width:100%;border:0;text-align:center;cursor:pointer;font-family:inherit}
.bd{padding:8px 12px 9px;display:flex;flex-direction:column;align-items:center;gap:7px;flex:1}
.ob{font-size:11.5px;line-height:1.38;color:var(--muted);text-align:center;width:100%}
.ob.none{font-style:italic;color:#9aa9bd}
.rsp{align-self:center;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--navy);background:#eef3f8;border:1px solid #e0e7f0;border-radius:20px;padding:3px 11px;white-space:nowrap}
.rsp.empty{background:none;border-style:dashed;border-color:#ccd6e3;color:#8ea4ba;font-weight:500}
.rsp.nova{background:#f1edff;border-color:#ddd2ff;color:#5b3fd6}
.rsp.nova u{color:#8a79d9}
.apoioline{width:100%;margin-top:7px;padding-top:7px;border-top:1px dashed #bcc9d9;font-size:11.5px;color:var(--muted);text-align:center}
.apoioline b{color:var(--ink);font-weight:600}
.legenda{margin-top:18px;display:flex;justify-content:center;gap:9px;align-items:center;font-size:11.5px;color:var(--muted)}
.rsp u{text-decoration:none;color:#8294aa;font-weight:600}
.subs{display:grid;gap:7px;margin-top:0;padding-top:7px;border-top:1px solid #c2cedd;width:100%}
.sub{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:7px;background:#f7f9fc;border:1px solid #c2cedd;border-radius:8px;padding:7px 10px;cursor:pointer;width:100%;min-height:56px;text-align:center;font-family:inherit;transition:background .12s, border-color .12s}
.sub:hover{background:#eaf1f8;border-color:#c3d4e6}
.hire{display:inline-flex;align-items:center;gap:4px;background:#fff6e5;border:1px dashed #e0b25c;color:#8a5a12;border-radius:20px;font-size:9.5px;font-weight:600;line-height:1.2;padding:1px 7px;max-width:100%;overflow-wrap:break-word;box-sizing:border-box;white-space:normal;text-align:center}
.hire u{text-decoration:none;color:#b08030;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:8px}
.sub .hire{align-self:center;width:auto;justify-content:center;flex-wrap:wrap;gap:3px}
.hireline{width:100%;display:flex;justify-content:center;margin:-3px 0 1px}
.sub .sn{font-size:13px;font-weight:600;color:var(--ink);line-height:1.25;min-width:0;width:100%;overflow-wrap:break-word}
.sub .rsp{white-space:normal;text-align:center;max-width:100%;font-size:10.5px;padding:3px 9px;overflow-wrap:break-word;box-sizing:border-box}
.sub .rsp u{display:none}
.sub .rsp{display:flex;justify-content:center;width:100%}
.sub .rsp span{min-width:0;overflow-wrap:break-word}
.fwnote{margin-top:8px;font-size:11px;color:var(--muted);text-align:center}
.legenda{margin-top:7px!important}
.nbox.band .bd{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;padding:5px 12px}
.nbox.band .hd{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding-right:132px;padding-left:132px}
.nbox.band .hd .rsp{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.hdbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding-right:104px;padding-left:104px}
.hdbtn .rsp{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--accent);border-color:var(--accent);color:var(--navy);font-size:10.5px;padding:2px 10px}
.nbox.band .hd .rsp{background:var(--accent);border-color:var(--accent);color:var(--navy);font-size:10.5px;padding:2px 10px}
.nbox.band .hd .rsp u{color:#5c6a16}
.nbox.band .hd .rsp.empty{background:none;border-style:dashed;border-color:rgba(232,255,0,.55);color:#dfe7f2}
.nbox.band .hd .rsp.nova{background:#f1edff;border-color:#ddd2ff;color:#5b3fd6}
.nbox.band .ob{text-align:center;width:auto;flex:0 1 auto}
.nbox.band .rsp{flex:0 0 auto}
.nbox.band .apoioline{width:auto;flex:0 0 auto;margin:0;padding:2px 0 2px 14px;border-top:none;border-left:1px dashed #bcc9d9;text-align:left}
@media (max-width:1100px){.lrow{grid-template-columns:1fr!important}}
/* ---------- panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,40,65,.35);z-index:40}
.panel{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:94vw;background:#fff;z-index:41;box-shadow:-10px 0 40px rgba(14,40,65,.2);display:flex;flex-direction:column}
.panel header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel header h3{margin:0;font-size:16px}
.panel header .sub{color:var(--muted);font-size:12px;margin-top:3px}
.panel .body{padding:18px 22px;overflow:auto;flex:1}
.panel footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal .sheet{background:#fff;border-radius:12px;width:640px;max-width:100%;box-shadow:0 20px 60px rgba(14,40,65,.3)}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font-size:16px}
.modal .body{padding:20px 22px}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* ---------- kanban ---------- */
.board{display:grid;gap:12px;align-items:start;padding-bottom:8px}
.col{background:#e9eef5;border-radius:10px;padding:10px;min-width:0}
.col h4{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.col h4 .c{background:#fff;border-radius:20px;padding:1px 8px;font-size:11px;color:var(--navy)}
.col.over{outline:2px dashed var(--navy-3);outline-offset:-2px}
.kc{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:9px;cursor:grab;box-shadow:0 1px 2px rgba(14,40,65,.06)}
.kc:active{cursor:grabbing}
.kc .code{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--navy-3)}
.kc .t{font-weight:600;margin:3px 0 7px;font-size:13.2px;line-height:1.3}
.kc .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.chip{display:inline-block;border-radius:20px;padding:2px 8px;font-size:10.5px;font-weight:600;background:#eef2f8;color:var(--navy);border:1px solid #e0e7f0;white-space:nowrap}
.chip.f{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.tag{background:#fff;color:var(--muted)}
.chip.p-Crítica{background:#fde8ea;color:#a52230;border-color:#f6cdd3}
.chip.p-Alta{background:#fdf0dd;color:#8a5d00;border-color:#f3dfc0}
.chip.p-Média{background:#e9eef5;color:#3d5878}
.chip.p-Baixa{background:#eef6f1;color:#2f7355}
.chip.ok{background:#e8f5ee;color:#1f7a54;border-color:#cde9db}
.chip.warn{background:#fdf0dd;color:#8a5d00;border-color:#f3dfc0}
.chip.late{background:#fde8ea;color:#a52230;border-color:#f6cdd3}
.empty{color:var(--muted);font-size:12px;padding:10px 6px;text-align:center}

/* ---------- roadmap ---------- */
.rm{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fchip{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
.fchip:hover{border-color:#9fb3c8;color:var(--ink)}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.rmhead,.rmrow{display:grid;grid-template-columns:270px 120px 118px repeat(12,minmax(0,1fr));align-items:stretch}
.rmhead{background:#f7f9fc;border-bottom:2px solid var(--navy);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rmhead>div{padding:9px 6px;text-align:center}
.rmhead>div:first-child,.rmhead>div:nth-child(2),.rmhead>div:nth-child(3){text-align:left;padding-left:12px}
.rmrow{border-bottom:1px solid var(--line);cursor:pointer}
.rmrow:hover{background:#f7f9fc}
.rmrow>div:first-child,.rmrow>div:nth-child(2),.rmrow>div:nth-child(3){padding:9px 12px}
.rmrow>div:first-child,.rmrow>div:nth-child(2),.rmrow>div:nth-child(3){display:flex;align-items:center}
.rmgrp{background:var(--navy);color:#fff;padding:6px 10px 6px 12px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:12px}
.rmadd{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:20px;font-size:10.5px;font-weight:600;padding:2px 10px;cursor:pointer;font-family:inherit;text-transform:none;letter-spacing:0;white-space:nowrap}
.rmadd:hover{background:var(--accent);border-color:var(--accent);color:var(--navy)}
.rmedit{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;color:#7b8ca3;letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:opacity .12s}
.rmrow:hover .rmedit{opacity:1}
.rmname{font-weight:600;font-size:13px;line-height:1.25}
.rmsub{color:var(--muted);font-size:11.5px;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rmsub .chip{font-size:10px}
.chip.wip{background:#eef2f8;color:#4a5575;border-color:#d9e2ee}
.mcell,.mcellh{position:relative;display:flex;align-items:center;min-height:44px}
.mcell.q,.mcellh.q{border-right:1px solid #e7ecf3}
.mfill{display:block;width:100%;height:16px;background:var(--navy-2)}
.mfill.ini{border-radius:3px 0 0 3px;margin-left:2px;width:calc(100% - 2px)}
.mfill.fim{border-radius:0 3px 3px 0;margin-right:2px;width:calc(100% - 2px)}
.mfill.ini.fim{border-radius:3px;margin:0 2px;width:calc(100% - 4px)}
.mfill.wip{background:#a9bdd3}
.mfill.ms{background:var(--accent)}
/* ---------- tables & kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .v{font-size:25px;font-weight:700;margin-top:5px;letter-spacing:-.02em}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.dark .l,.kpi.dark .s{color:#a9c0d6}
.kpi.dark .v{color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px}
.card>h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}
.card .cbody{padding:16px 18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 12px;border-bottom:2px solid var(--navy)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#f7f9fc}
.prog{height:9px;background:#e4eaf2;border-radius:20px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--navy-3);border-radius:20px}
.prog i.full{background:var(--green)}
.mini{display:flex;align-items:flex-end;gap:24px;height:172px;padding:6px 4px 0}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.mgrp{display:flex;align-items:flex-end;justify-content:center;gap:7px;height:130px;width:100%}
.mgrp i{display:block;width:28px;border-radius:3px 3px 0 0;min-height:2px}
.b-pe{background:#c8d6e6}
.b-int{background:#8aa6c2}
.kc .d{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:4px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kc .d.none{font-style:italic;color:#9fb0c4}
.b-con{background:#4e6b91}
.b-real{background:var(--navy)}
.mlab{font-size:11.5px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.note{background:#f7f9fc;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:11px 14px;font-size:12.5px;color:var(--muted);margin-bottom:16px}
.note b{color:var(--ink)}
.banner{background:#fdf0dd;border:1px solid #f3dfc0;color:#7a5300;border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:80;box-shadow:0 10px 30px rgba(14,40,65,.3)}
@media (max-width:980px){.side{display:none}.groups{flex-direction:column}.rmhead,.rmrow{grid-template-columns:1fr}.q{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="grad"></div>
    <div class="brandbox">
      <img class="logo" src="/_blob/fc45890b6d1adde090d11526d173972d" alt="Peers Consulting + Technology">
      <div class="brandsub">Platforms 2027</div>
    </div>

    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);

  v = v||0;
  if(Math.abs(v) >= 1000000) return "R$ " + (v/1000000).toFixed(2).replace(".",",") + " MM";

  return "R$ " + Math.round(v);
}

  var max = 0;
  state[col].forEach(function(r){

    var m = /(\d+)\s*$/.exec(c);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return prefix + "-" + String(max+1).padStart(3,"0");
}
function dataFecha(p){ return p.fechamento || p.previsao || ""; }

}
function realizadoTrim(p, q){ return num(p["real" + q]); }

function connect(){
  if(!window.claude || !claude.use){ offline(); return; }
  var t = setTimeout(function(){ if(!ready){ loadWarn = true; setStatus("#c98a00","sem resposta do servidor"); } }, 10000);
  claude.use("db").then(function(db){
    if(!db){ clearTimeout(t); offline(); return; }
    DB = db;
    COLS.forEach(function(col){
      DB.collection(col).onSnapshot(function(snap){
        clearTimeout(t);
        if(!ready){ ready = true; setStatus("#2bff7a","dados salvos automaticamente"); }
        state[col] = snap.docs.map(function(d){ var o = Object.assign({}, d.data()); o.id = d.id; return o; });
        render();
      }, function(){ setStatus("#c98a00","conexão instável"); });
    });
    DB.doc("config/geral").onSnapshot(function(s){
      state.config = s.exists ? Object.assign({}, s.data()) : {};
      render();
    }, function(){});
  }).catch(function(){ clearTimeout(t); offline(); });
}

function alinharBlocos(row){
  var run = function(){
    if(!row || !row.parentNode) return;
    [".hd", ".ob", ".sub"].forEach(function(sel){
      var items = Array.prototype.slice.call(row.querySelectorAll(sel));
      if(items.length < 2) return;
      items.forEach(function(n){ n.style.minHeight = ""; });
      var max = 0;
      items.forEach(function(n){ max = Math.max(max, n.offsetHeight); });
      if(max > 0) items.forEach(function(n){ n.style.minHeight = max + "px"; });
    });
  };
  if(window.requestAnimationFrame) requestAnimationFrame(run); else setTimeout(run, 0);
  if(document.fonts && document.fonts.ready && document.fonts.ready.then) document.fonts.ready.then(run)["catch"](function(){});
}

function mesDe(v, fim){
  if(typeof v === "number" && isFinite(v)) return Math.min(12, Math.max(1, Math.round(v)));

}

function cardMatches(c){

function isLate(c){

        el("th",{class:"num",text:"Contratado"}),el("th",{text:"Reconhecimento"}),el("th",{class:"num",text:"Realizado apurado"}),el("th",{class:"num",text:"A realizar"})])]),

    ]) : el("div",{class:"cbody"},[el("div",{class:"empty",text:"Nenhuma proposta ganha registrada para " + ano + "."})])
  ]));

  v.appendChild(el("div",{class:"note",html:"<b>Contratado</b> é o valor total dos contratos ganhos no ano, inclusive os de longo prazo que serão entregues depois. <b>Realizado</b> é a receita que já caiu: só entra quando alguém apura e preenche o <i>realizado por trimestre</i> na proposta, somado ao carry-over de <b>Editar metas</b>. O painel não projeta realizado a partir do contrato. Os dois vêm das propostas marcadas como <b>Ganha</b> na página 06. Nada aqui é estimado pelo painel: o que não foi cadastrado não aparece."}));
}
function alt(valor, maxV){ return Math.max(0, Math.round((valor||0)/maxV*130)); }
function metaTrim(mapa, q, anual){
  var v = num((mapa||{})[q]);
  if(v) return v;
  return anual ? anual/4 : 0;
}
function barraMeta(rotulo, meta, real){
  var pct = meta ? Math.min(100, Math.round(real/meta*100)) : 0;
  return el("div",{style:"margin-bottom:14px"},[
    el("div",{style:"display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px"},[
      el("span",{html:"<b>"+esc(rotulo)+"</b>" + (meta?(" · "+brlFull(meta)):" · a definir")}),
      el("span",{text: meta ? (brlFull(real) + "  (" + Math.round(real/meta*100) + "%)") : brlFull(real)})
    ]),
    el("div",{class:"prog"},[el("i",{class:pct>=100?"full":"",style:"width:"+pct+"%"})])
  ]);
}
function kpi(l, v, s, cls){
  return el("div",{class:"kpi "+(cls||"")},[el("div",{class:"l",text:l}), el("div",{class:"v",text:v}), el("div",{class:"s",text:s||""})]);
}
function editMeta(){
  var cfg = state.config || {};
  var ano, meta, metaI, carry, t1, t2, t3, t4, i1, i2, i3, i4;
  openModal("Metas da offering", function(b){
    var g = el("div",{class:"row3"}); b.appendChild(g);
    ano = inText(cfg.ano||String(new Date().getFullYear())); g.appendChild(el("div",{class:"fld"},[el("label",{text:"Ano"}), ano]));
    meta = inNum(cfg.meta,"0"); g.appendChild(el("div",{class:"fld"},[el("label",{text:"Meta PE (R$)"}), meta]));
    metaI = inNum(cfg.metaInterna,"0"); g.appendChild(el("div",{class:"fld"},[el("label",{text:"Meta interna da offering (R$)"}), metaI]));
    carry = field(b,"Carry-over contratado (R$)", inNum(cfg.carry,"0"));
    b.appendChild(el("div",{class:"note",text:"As metas por trimestre são opcionais. Em branco, o painel divide a meta anual por quatro."}));
    var mt = cfg.metasT || {}, mi = cfg.metasTI || {};
    b.appendChild(el("div",{class:"fld"},[el("label",{text:"Meta PE por trimestre (R$)"})]));
    var g2 = el("div",{class:"row2"}); b.appendChild(g2);
    t1 = inNum(mt.T1,"T1"); g2.appendChild(el("div",{class:"fld"},[el("label",{text:"T1"}), t1]));
    t2 = inNum(mt.T2,"T2"); g2.appendChild(el("div",{class:"fld"},[el("label",{text:"T2"}), t2]));
    t3 = inNum(mt.T3,"T3"); g2.appendChild(el("div",{class:"fld"},[el("label",{text:"T3"}), t3]));
    t4 = inNum(mt.T4,"T4"); g2.appendChild(el("div",{class:"fld"},[el("label",{text:"T4"}), t4]));
    b.appendChild(el("div",{class:"fld"},[el("label",{text:"Meta interna por trimestre (R$)"})]));
    var g3 = el("div",{class:"row2"}); b.appendChild(g3);
    i1 = inNum(mi.T1,"T1"); g3.appendChild(el("div",{class:"fld"},[el("label",{text:"T1"}), i1]));
    i2 = inNum(mi.T2,"T2"); g3.appendChild(el("div",{class:"fld"},[el("label",{text:"T2"}), i2]));
    i3 = inNum(mi.T3,"T3"); g3.appendChild(el("div",{class:"fld"},[el("label",{text:"T3"}), i3]));
    i4 = inNum(mi.T4,"T4"); g3.appendChild(el("div",{class:"fld"},[el("label",{text:"T4"}), i4]));
  }, function(){
    saveConfig({ano:ano.value.trim(), meta:num(meta.value), metaInterna:num(metaI.value), carry:num(carry.value),
      metasT:{T1:num(t1.value),T2:num(t2.value),T3:num(t3.value),T4:num(t4.value)},
      metasTI:{T1:num(i1.value),T2:num(i2.value),T3:num(i3.value),T4:num(i4.value)}});
  });
}

/* ============================ start ============================ */
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeLayers(); });
function fromHash(){
  var h = (location.hash||"").replace("#","");
  for(var i=0;i<PAGES.length;i++) if(PAGES[i].id === h){ ui.page = h; return; }
}
fromHash();
window.addEventListener("hashchange", function(){ fromHash(); ui.filters = {}; render(); });
var resizeT;
window.addEventListener("resize", function(){
  clearTimeout(resizeT);
  resizeT = setTimeout(function(){ if(ui.page === "framework") render(); }, 220);
});
render();
connect();
})();
</script>
